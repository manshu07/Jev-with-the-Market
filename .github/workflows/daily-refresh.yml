name: Daily refresh

# EOD pipeline: after NSE bhavcopy (~18:00 IST) refresh data, features, watchlists
# and periods, then push to main so Vercel auto-deploys the updated site.
# Uses the built-in GITHUB_TOKEN (contents: write) — no extra secrets required.

on:
  schedule:
    - cron: "30 12 * * 1-5" # 18:00 IST (UTC+5:30), Mon-Fri
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download latest bars (Yahoo, full re-fetch)
        # --force: the phase-1 completeness check is anchored to a frozen date, so a
        # plain run would skip everything once cached. Daily full re-fetch of 101
        # symbols (~3 min) keeps the cache rolling; bhavcopy repairs re-apply after.
        run: npm run download -- --force

      - name: Repair placeholder/bad bars from NSE bhavcopy
        run: npx tsx scripts/repair-from-bhavcopy.ts

      - name: Rebuild features
        run: npm run features

      - name: Rebuild watchlists and periods datasets
        run: npx tsx scripts/build-watchlists-periods.ts

      - name: Commit and push (triggers Vercel deploy)
        run: |
          git config user.name "daily-refresh-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/raw data/processed/market.duckdb data/processed/stock_features.parquet \
                  data/universe/trading_calendar.json public/watchlists public/periods \
                  results config/universe.json config/data.json data/raw/manifest.json
          if git diff --cached --quiet; then
            echo "No changes since last run — nothing to publish."
          else
            git commit -m "daily refresh $(date -u +%F): bars, repairs, features, watchlists, periods"
            git push
          fi
